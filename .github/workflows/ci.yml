name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade build backend (act fix)
        run: |
          python -m pip install --upgrade pip setuptools wheel setuptools_scm

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Build sdist
        run: python -m build --sdist --no-isolation

      - name: Inspect built artifacts
        run: |
          echo "Checking metadata with twine:"
          twine check dist/*
          echo "Wheel contents:"
          unzip -l dist/*.whl

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Importability check
        run: |
          python - << 'EOF'
          import dvae
          from dvae import VAEClassifier
          from dvae.config import hyperparameters
          print("IMPORT_DVAE_OK")
          print("IMPORT_CLASSIFIER_OK")
          print("IMPORT_CONFIG_OK", hasattr(hyperparameters, "default_hparams"))
          EOF

      - name: Runtime smoke test
        run: |
          python - << 'EOF'
          from dvae import VAEClassifier
          model = VAEClassifier(input_dim=10, latent_dim=2)
          print("SMOKE_TEST_OK")
          EOF

      - name: Skip example tests (datasets are external)
        run: |
          echo "Skipping example tests because datasets are external to the distribution."
          echo "To run example tests in CI, provide dataset artifacts or a test dataset path."

      - name: Summary
        run: |
          echo "### DVAE CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Wheel built and validated" >> $GITHUB_STEP_SUMMARY
          echo "- sdist built and validated" >> $GITHUB_STEP_SUMMARY
          echo "- Importability checks passed" >> $GITHUB_STEP_SUMMARY
          echo "- Runtime smoke test passed" >> $GITHUB_STEP_SUMMARY
          echo "- Example tests skipped (datasets external)" >> $GITHUB_STEP_SUMMARY
